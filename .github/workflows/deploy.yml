name: Build and Deploy to Home Server

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tech-blog-suggestion:latest

  deploy-to-homeserver:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy latest docker-compose.yaml to app folder
        run: cp ${{ github.workspace }}/docker-compose.yaml ~/apps/tech-digest/docker-compose.yml

      - name: Pull image and restart container
        working-directory: ~/apps/tech-digest
        run: |
          docker compose pull app
          docker compose up -d --remove-orphans
          docker image prune -f